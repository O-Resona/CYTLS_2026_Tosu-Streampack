<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CYT 2026: Lazer Scramble</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages/showcase.css">
  <link rel="stylesheet" href="css/pages/mappool.css">
  <link rel="stylesheet" href="css/pages/playing.css">
  <link rel="stylesheet" href="css/pages/showcase-countdown.css">
  <link rel="stylesheet" href="css/pages/match-countdown.css">
  <link rel="stylesheet" href="css/pages/bracket.css">
  <link rel="stylesheet" href="css/pages/schedule.css">
  <link rel="stylesheet" href="css/pages/winner.css">
</head>
<body>

  <div class="stage" id="stage">

    <!-- =====================================================
         左侧导航 280 x 1080
         ===================================================== -->
    <aside class="sidebar">

      <!-- 上半区 -->
      <button class="nav-btn" data-target="bracket">Bracket</button>
      <button class="nav-btn" data-target="schedule">Schedule</button>
      <button class="nav-btn" data-target="match-countdown">Match Info</button>
      <button class="nav-btn" data-target="mappool">Mappool</button>
      <button class="nav-btn" data-target="playing">Playing</button>
      <button class="nav-btn" data-target="winner">Winner</button>

      <!-- 空行 + 下半区 -->
      <button class="nav-btn nav-btn--gap-top" data-target="showcase-countdown">Showcase Countdown</button>
      <button class="nav-btn" data-target="showcase">Showcase</button>

      <!-- =====================================================
           Mappool 控制面板：仅 mappool 页面激活时显示
           ===================================================== -->
      <div class="mappool-panel" id="mappoolPanel" hidden>

        <div class="round-selector">
          <div class="round-label">当前pick</div>
          <div class="custom-select">
            <div class="selected-option" id="mappoolSelectedPick">—</div>
            <div class="options-container" id="mappoolPickOptions"></div>
          </div>
          <button type="button" class="mp-btn--show-data" id="mappoolShowDataBtn">展示数据</button>
        </div>

        <div class="first-picker-selector">
          <div class="round-label">先选方</div>
          <div class="first-picker-options">
            <label><input type="radio" name="firstPicker" value="red" checked><span>红队</span></label>
            <label><input type="radio" name="firstPicker" value="blue"><span>蓝队</span></label>
          </div>
        </div>

        <div class="mappool-panel__group mappool-panel__group--row">
          <button type="button" id="mappoolRedProtectBtn"  class="mp-btn mp-btn--red-protect active">RED PROTECT</button>
          <button type="button" id="mappoolRedBanBtn"      class="mp-btn mp-btn--red">RED BAN</button>
        </div>

        <div class="mappool-panel__group mappool-panel__group--row">
          <button type="button" id="mappoolBlueProtectBtn" class="mp-btn mp-btn--blue-protect">BLUE PROTECT</button>
          <button type="button" id="mappoolBlueBanBtn"     class="mp-btn mp-btn--blue">BLUE BAN</button>
        </div>

        <div class="mappool-panel__group">
          <button type="button" id="mappoolRedPickBtn"  class="mp-btn mp-btn--red-pick">RED PICK</button>
          <button type="button" id="mappoolBluePickBtn" class="mp-btn mp-btn--blue-pick">BLUE PICK</button>
        </div>

        <div class="mappool-panel__group">
          <button type="button" id="mappoolResetBtn"  class="mp-btn mp-btn--reset">重置所有</button>
          <button type="button" id="mappoolReloadBtn" class="mp-btn mp-btn--reload">从 JSON 重新加载</button>
        </div>

      </div>

      <!-- =====================================================
           Bracket 控制面板：仅 bracket 页面激活时显示
           ===================================================== -->
      <div class="bracket-panel" id="bracketPanel" hidden>

        <div class="bracket-panel__row">
          <div class="bracket-panel__label">Team 1</div>
          <select class="bracket-panel__select" id="bpTeam1"></select>
        </div>

        <div class="bracket-panel__row">
          <div class="bracket-panel__label">Team 2</div>
          <select class="bracket-panel__select" id="bpTeam2"></select>
        </div>

        <div class="bracket-panel__row">
          <div class="bracket-panel__label">Date</div>
          <input class="bracket-panel__input" id="bpDate" type="text"
                 placeholder="MM/DD HH:mm" autocomplete="off">
        </div>

        <button type="button" class="bp-btn bp-btn--reset" id="bpReset">重置本场覆盖</button>

        <button type="button" class="bp-btn bp-btn--danger" id="bpClearAll">
          <span class="bp-btn__icon" aria-hidden="true">⚠</span>
          清除所有本地修改
        </button>
      </div>

      <!-- =====================================================
           绿幕宽度面板：仅 playing 页面激活时显示
           ===================================================== -->
      <div class="green-panel" id="greenPanel" hidden>

        <div class="green-panel__label">GREEN WIDTH</div>

        <input type="range" class="green-panel__range" id="plGreenWidth"
               min="960" max="1920" step="10" value="1920">

        <div class="green-panel__value" id="plGreenWidthVal">1920 px</div>

        <input type="number" class="green-panel__input" id="plGreenWidthInput"
               min="960" max="1920" step="10" value="1920"
               autocomplete="off">

      </div>
    </aside>

    <!-- =====================================================
         右侧主区域 1920 x 1080
         ===================================================== -->
    <main class="main" id="pageRoot">

      <!-- ---------- 全局背景媒体 ---------- -->

      <video class="global-bg-video" data-bg="main" src="src/bg.mp4"  muted loop autoplay playsinline preload="auto" style="display:none"></video>
      <video class="global-bg-video" data-bg="alt2" src="src/bg2.mp4" muted loop autoplay playsinline preload="auto"></video>
      <video class="global-bg-video" data-bg="red"  src="src/bg_red.mp4" muted loop playsinline preload="auto" style="display:none"></video>

      <img class="global-bg-image" data-bg="main"  src="src/bg.png"  alt="" style="display:none">
      <img class="global-bg-image" data-bg="alt"   src="src/bg2.png" alt="">
      <img class="global-bg-image" data-bg="third" src="src/bg3.png" alt="" style="display:none">

      <div class="global-bg-cover"></div>

      <div class="final-bg" id="finalBg" hidden>
        <img class="ft-bg4" src="src/bg4.png" alt="">
        <img class="ft-bg3" src="src/bg3.png" alt="">
      </div>

      <div class="global-hud" id="globalHud">

        <div class="global-hud__team global-hud__team--left">
          <img class="global-hud__avatar" id="ghTeam1Avatar" alt="">
          <div class="global-hud__info">
            <div class="global-hud__row global-hud__row--tag">
              <span class="global-hud__tag global-hud__tag--red">team red</span>
              <div class="global-hud__stars" id="ghTeam1Stars"></div>
            </div>
            <div class="global-hud__row global-hud__row--name" id="ghTeam1Name">—</div>
            <div class="global-hud__row global-hud__row--seed" id="ghTeam1Seed"></div>
          </div>
        </div>

        <div class="global-hud__team global-hud__team--right">
          <div class="global-hud__info">
            <div class="global-hud__row global-hud__row--tag">
              <div class="global-hud__stars" id="ghTeam2Stars"></div>
              <span class="global-hud__tag global-hud__tag--blue">team blue</span>
            </div>
            <div class="global-hud__row global-hud__row--name" id="ghTeam2Name">—</div>
            <div class="global-hud__row global-hud__row--seed" id="ghTeam2Seed"></div>
          </div>
          <img class="global-hud__avatar" id="ghTeam2Avatar" alt="">
        </div>

      </div>

      <div class="chatbox" id="globalChatBox">
        <div class="chatbox__messages" id="globalChatMessages"></div>
      </div>

      <div class="chatbox" id="globalChatBox">
        <div class="chatbox__messages" id="globalChatMessages"></div>
      </div>

      <!-- 自动切页转场层（ 上下滑入） -->
      <div class="auto-transition" id="autoTransition" hidden>
        <img class="auto-cut-top"    src="src/cut_top.png"    alt="">
        <img class="auto-cut-bottom" src="src/cut_bottom.png" alt="">
      </div>

      <div class="global-logo" id="globalLogo">
        <img class="global-logo__img" src="src/logo.png" alt="">
        <img class="global-logo__badge" id="globalLogoBadge" alt="">
      </div>

      <div class="final-fore" id="finalFore" hidden>
        <img class="ft-text"  src="src/text.png"  alt="">
        <img class="ft-text2" src="src/text2.png" alt="">
        <img class="ft-cut-top"    src="src/cut_top.png"    alt="">
        <img class="ft-cut-bottom" src="src/cut_bottom.png" alt="">
      </div>

    </main>

  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
